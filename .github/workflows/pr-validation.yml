name: PBIP PR Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - '**.pbip'
      - '**.tmdl'
      - '**.json'
      - '**.bim'
      - '**.pbix'
      - '**.xml'

  workflow_dispatch:
    inputs:
      baseline_strategy:
        description: >
          What to use as the OLD (baseline) version.
          base_branch = the branch this PR targets (default for PRs).
          tag         = a release tag, e.g. v1.0.0.
          commit      = a specific commit SHA.
          branch      = any other branch name.
        required: true
        default: base_branch
        type: choice
        options:
          - base_branch
          - tag
          - commit
          - branch
      baseline_ref:
        description: >
          The ref to use as baseline when strategy is tag / commit / branch.
          Leave empty when strategy is base_branch.
        required: false
        default: ''

jobs:

  # ── 1. Detect which PowerBI project folders changed ───────────────────────
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix:       ${{ steps.detect.outputs.matrix }}
      any_changed:  ${{ steps.detect.outputs.any_changed }}
      baseline_ref: ${{ steps.resolve.outputs.baseline_ref }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve baseline ref
        id: resolve
        shell: bash
        run: |
          strategy="${{ github.event.inputs.baseline_strategy || 'base_branch' }}"
          override="${{ github.event.inputs.baseline_ref }}"

          case "$strategy" in
            base_branch)
              ref="${{ github.base_ref || 'main' }}"
              ;;
            tag|commit|branch)
              if [ -z "$override" ]; then
                echo "ERROR: baseline_ref must be set when strategy is $strategy"
                exit 1
              fi
              ref="$override"
              ;;
            *)
              echo "ERROR: Unknown baseline_strategy: $strategy"
              exit 1
              ;;
          esac

          echo "Baseline strategy : $strategy"
          echo "Baseline ref      : $ref"
          echo "baseline_ref=$ref" >> $GITHUB_OUTPUT

      - name: Detect changed PowerBI projects
        id: detect
        shell: bash
        run: |
          BASELINE_REF="${{ steps.resolve.outputs.baseline_ref }}"
          git fetch origin "$BASELINE_REF" --depth=1

          changed=$(git diff --name-only "origin/$BASELINE_REF"...HEAD 2>/dev/null \
                    || git diff --name-only "origin/$BASELINE_REF" HEAD \
                    || true)

          echo "Changed files:"
          echo "$changed"

          matched_projects=""
          while IFS= read -r pbip_file; do
            project_dir=$(dirname "$pbip_file" | sed 's|^\./||')
            if echo "$changed" | grep -q "^${project_dir}/"; then
              matched_projects="$matched_projects"$'\n'"$project_dir"
            fi
            if echo "$changed" | grep -qF "${pbip_file#./}"; then
              matched_projects="$matched_projects"$'\n'"$project_dir"
            fi
          done < <(find . -name "*.pbip" -not -path '*/.git/*')

          matched_projects=$(echo "$matched_projects" | grep -v '^$' | sort -u)

          echo "Matched changed projects:"
          echo "$matched_projects"

          if [ -z "$matched_projects" ]; then
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            json=$(echo "$matched_projects" | jq -R '{project: .}' | jq -sc '{include: .}')
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "matrix=$json" >> $GITHUB_OUTPUT
          fi

  # ── 2. Validate each changed project ──────────────────────────────────────
  validate:
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull PBIP diff Docker image
        run: docker pull ghcr.io/somasekarnaidu6689-cyber/pbip-diff:latest

      - name: Extract baseline version
        shell: bash
        run: |
          BASELINE_REF="${{ needs.detect.outputs.baseline_ref }}"
          PROJECT_DIR="${{ matrix.project }}"

          git fetch origin "$BASELINE_REF" --depth=1
          mkdir -p /tmp/pbip_old

          if git --work-tree=/tmp/pbip_old \
                 checkout "origin/$BASELINE_REF" -- "$PROJECT_DIR" 2>/dev/null; then

            old_pbip=$(find "/tmp/pbip_old/$PROJECT_DIR" -maxdepth 1 \
                         -name "*.pbip" 2>/dev/null | head -1)
            if [ -n "$old_pbip" ]; then
              echo "IS_NEW_PROJECT=false" >> $GITHUB_ENV
              echo "Baseline .pbip : $old_pbip"
            else
              echo "IS_NEW_PROJECT=true" >> $GITHUB_ENV
              echo "Folder exists in baseline but no .pbip marker — treating as new project."
            fi
          else
            echo "IS_NEW_PROJECT=true" >> $GITHUB_ENV
            echo "Project not found at baseline ref '$BASELINE_REF' — this is a new project."
          fi

      - name: Run PBIP diff
        shell: bash
        run: |
          PROJECT_DIR="${{ matrix.project }}"
          BASELINE_REF="${{ needs.detect.outputs.baseline_ref }}"
          mkdir -p results

          if [ "${IS_NEW_PROJECT}" = "true" ]; then
            echo "New project — no baseline version to diff against." > results/diff-output.txt
            exit 0
          fi

          OLD_DIR="/tmp/pbip_old/$PROJECT_DIR"
          NEW_DIR="./$PROJECT_DIR"

          old_pbip=$(find "$OLD_DIR" -maxdepth 1 -name "*.pbip" 2>/dev/null | head -1)
          new_pbip=$(find "$NEW_DIR" -maxdepth 1 -name "*.pbip" 2>/dev/null | head -1)

          if [ -z "$old_pbip" ]; then
            echo "No .pbip found in baseline at $OLD_DIR" > results/diff-output.txt
            exit 0
          fi
          if [ -z "$new_pbip" ]; then
            echo "No .pbip found in PR branch at $NEW_DIR" > results/diff-output.txt
            exit 0
          fi

          echo "Baseline ref : $BASELINE_REF"
          echo "OLD .pbip    : $old_pbip"
          echo "NEW .pbip    : $new_pbip"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "/tmp/pbip_old:/tmp/pbip_old" \
            ghcr.io/somasekarnaidu6689-cyber/pbip-diff:latest \
            --old "$OLD_DIR" \
            --new "/workspace/$PROJECT_DIR" \
            2>&1 | tee results/diff-output.txt

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          mkdir -p results

          TEST_SM=$(find . -type d -name "*.SemanticModel" \
                      -not -path '*/.git/*' \
                      -not -path '*/tmp/*' \
                    | while read -r sm; do
                        [ -d "$sm/definition" ] && echo "$sm" && break
                      done)
          echo "Using SemanticModel for tests: $TEST_SM"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e "TEST_SEMANTIC_MODEL=$TEST_SM" \
            --entrypoint python \
            ghcr.io/${{ github.repository_owner }}/pbip-diff:latest \
            -m unittest discover -s pbix_diff -p 'test_*.py' \
            2>&1 | tee results/test-output.txt

          echo "status=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate PR comment
        shell: bash
        run: |
          python3 - <<PYEOF
          import os, textwrap

          project      = os.environ.get("PROJECT", "").strip() or "powerBi"
          status       = os.environ.get("STATUS", "1")
          baseline_ref = os.environ.get("BASELINE_REF", "base branch")

          with open("results/test-output.txt") as f:
              test_output = f.read()
          try:
              with open("results/diff-output.txt") as f:
                  diff_output = f.read()
          except FileNotFoundError:
              diff_output = "Diff was not run."

          result = "All tests passed" if status == "0" else "Some tests failed"

          body = f"""### PBIP Validation : \`{project}\`

          **Status:** {result}
          **Baseline:** \`{baseline_ref}\`

          > ! This diff covers semantic model (tables, columns, measures, relationships, roles),
          > report (pages, visuals, filters, slicers) and layout (canvas, bookmarks, z-order).
          > Items **not** compared: refresh schedules, gateways, custom visuals, service-side
          > themes, dataflow dependencies, RLS membership, subscriptions. See PBIP_GOVERNANCE.md.

          <details>
          <summary>PBIP diff report</summary>

          \`\`\`
          {diff_output}
          \`\`\`

          </details>

          <details>
          <summary>Unit test output</summary>

          \`\`\`
          {test_output}
          \`\`\`

          </details>
          """

          os.makedirs("results", exist_ok=True)
          with open("results/comment.txt", "w") as f:
              f.write(textwrap.dedent(body))
          PYEOF
        env:
          PROJECT:      ${{ matrix.project }}
          STATUS:       ${{ steps.tests.outputs.status }}
          BASELINE_REF: ${{ needs.detect.outputs.baseline_ref }}

      - name: Find existing PR comment for this project
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "PBIP Validation — `${{ matrix.project }}`"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-file: results/comment.txt
          edit-mode: replace

      - name: Fail job if tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1