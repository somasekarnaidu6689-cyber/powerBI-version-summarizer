name: PBIP PR Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR branch (new version)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pbix_diff/requirements.txt

      - name: Determine changed files
        id: changed
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$changed" | grep -E '\.pbip($|/)|\.SemanticModel/|powerBi/' >/dev/null; then
            echo "pbip_changed=true" >> $GITHUB_OUTPUT
          else
            echo "pbip_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          mkdir -p results
          set -o pipefail
          python -m unittest discover -s pbix_diff -p 'test_*.py' 2>&1 | tee results/test-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Extract old version of powerBi folder from base branch
        if: steps.changed.outputs.pbip_changed == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/pbip_old
          git fetch origin ${{ github.base_ref }} --depth=1
          # Checkout just the powerBi folder from the base branch into a temp location
          git --work-tree=/tmp/pbip_old checkout origin/${{ github.base_ref }} -- powerBi
          echo "Old powerBi folder contents:"
          ls /tmp/pbip_old/powerBi/

      - name: Run PBIP diff
        id: diff
        if: steps.changed.outputs.pbip_changed == 'true'
        shell: bash
        run: |
          mkdir -p results
          # New version = current PR checkout (./powerBi)
          # Old version = base branch snapshot (/tmp/pbip_old/powerBi)
          OLD_PBIP=$(find /tmp/pbip_old/powerBi -name "*.pbip" | head -1)
          NEW_PBIP=$(find ./powerBi -name "*.pbip" | head -1)

          if [ -z "$OLD_PBIP" ]; then
            echo "diff_output=No .pbip file found in base branch powerBi folder." >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$NEW_PBIP" ]; then
            echo "diff_output=No .pbip file found in PR powerBi folder." >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Old PBIP: $OLD_PBIP"
          echo "New PBIP: $NEW_PBIP"

          OLD_DIR=$(dirname "$OLD_PBIP")
          NEW_DIR=$(dirname "$NEW_PBIP")

          python pbix_diff/run.py --old "$OLD_DIR" --new "$NEW_DIR" 2>&1 | tee results/diff-output.txt
          echo "diff_exit=$?" >> $GITHUB_OUTPUT

      - name: Generate PR comment
        shell: bash
        run: |
          python - <<PYEOF
          import os
          import textwrap

          status        = os.environ.get("STATUS", "1")
          pbip_changed  = os.environ.get("PBIP_CHANGED", "false")
          changed_files = os.environ.get("CHANGED_FILES", "")

          with open("results/test-output.txt") as f:
              test_output = f.read()

          diff_output = ""
          diff_section = ""
          if pbip_changed == "true":
              try:
                  with open("results/diff-output.txt") as f:
                      diff_output = f.read()
              except FileNotFoundError:
                  diff_output = "Diff was not run or produced no output."

              diff_section = f"""
          <details>
          <summary>PBIP diff report</summary>

          \`\`\`
          {diff_output}
          \`\`\`

          </details>
          """

          result    = "✅ All tests passed"    if status == "0" else "❌ Some tests failed"
          pbip_note = ("⚠️ PBIP-related files were detected in this PR — diff report below."
                       if pbip_changed == "true"
                       else "ℹ️ No PBIP-related files were detected in this PR.")

          body = f"""### GitHub PR Validation

          **Status:** {result}
          **PBIP detection:** {pbip_note}
          {diff_section}
          <details>
          <summary>Changed files</summary>

          \`\`\`text
          {changed_files}
          \`\`\`

          </details>

          <details>
          <summary>Unit test output</summary>

          \`\`\`text
          {test_output}
          \`\`\`

          </details>
          """

          body = textwrap.dedent(body)

          os.makedirs("results", exist_ok=True)
          with open("results/comment.txt", "w") as f:
              f.write(body)
          PYEOF
        env:
          STATUS: ${{ steps.tests.outputs.status }}
          PBIP_CHANGED: ${{ steps.changed.outputs.pbip_changed }}
          CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}

      - name: Find existing PR comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: GitHub PR Validation

      - name: Comment on pull request
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-file: results/comment.txt
          edit-mode: replace

      - name: Fail job if tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1