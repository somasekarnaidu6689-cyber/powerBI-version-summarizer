name: PBIP PR Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pbix_diff/requirements.txt

      - name: Determine changed files
        id: changed
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$changed" | grep -E '\.pbip($|/)|\.SemanticModel/|powerBi/' >/dev/null; then
            echo "pbip_changed=true" >> $GITHUB_OUTPUT
          else
            echo "pbip_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          mkdir -p results
          set -o pipefail
          python -m unittest discover -s pbix_diff -p 'test_*.py' 2>&1 | tee results/test-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate PR comment
        shell: bash
        run: |
          python - <<PYEOF
          import os

          status       = os.environ.get("STATUS", "1")
          pbip_changed = os.environ.get("PBIP_CHANGED", "false")
          changed_files = os.environ.get("CHANGED_FILES", "")

          with open("results/test-output.txt") as f:
              test_output = f.read()

          result    = "✅ All tests passed"    if status == "0" else "❌ Some tests failed"
          pbip_note = ("PBIP-related files were detected in this PR."
                       if pbip_changed == "true"
                       else "No PBIP-related files were detected in this PR.")

          body = f"""### GitHub PR Validation

          **Status:** {result}
          **PBIP detection:** {pbip_note}
          **Command:** \`python -m unittest discover -s pbix_diff -p 'test_*.py'\`
          **Exit code:** {status}

          <details>
          <summary>Changed files</summary>

          \`\`\`text
          {changed_files}
          \`\`\`

          </details>

          <details>
          <summary>Test output</summary>

          \`\`\`text
          {test_output}
          \`\`\`

          </details>
          """

          import textwrap
          body = textwrap.dedent(body)

          os.makedirs("results", exist_ok=True)
          with open("results/comment.txt", "w") as f:
              f.write(body)
          PYEOF
        env:
          STATUS: ${{ steps.tests.outputs.status }}
          PBIP_CHANGED: ${{ steps.changed.outputs.pbip_changed }}
          CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}

      - name: Find existing PR comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: GitHub PR Validation

      - name: Comment on pull request
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-file: results/comment.txt
          edit-mode: replace

      - name: Fail job if tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1