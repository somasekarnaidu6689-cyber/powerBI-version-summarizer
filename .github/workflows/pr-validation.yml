# .github/workflows/pr-validation.yml
name: PBIP PR Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any_changed: ${{ steps.detect.outputs.any_changed }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed PowerBI projects
        id: detect
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)

          echo "Changed files:"
          echo "$changed"

          # Find all folders containing a .pbip file in the PR branch
          # These are the project roots — no hardcoding of folder names
          matched_projects=""
          while IFS= read -r pbip_file; do
            project_dir=$(dirname "$pbip_file" | sed 's|^\./||')
            # Check if any changed file lives inside this project folder
            if echo "$changed" | grep -q "^${project_dir}/"; then
              matched_projects="$matched_projects"$'\n'"$project_dir"
            fi
            # Also check if the .pbip file itself changed
            if echo "$changed" | grep -qF "${pbip_file#./}"; then
              matched_projects="$matched_projects"$'\n'"$project_dir"
            fi
          done < <(find . -name "*.pbip" -not -path '*/.git/*')

          # Deduplicate
          matched_projects=$(echo "$matched_projects" | grep -v '^$' | sort -u)

          echo "Matched changed projects:"
          echo "$matched_projects"

          if [ -z "$matched_projects" ]; then
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            json=$(echo "$matched_projects" | jq -R '{project: .}' | jq -sc '{include: .}')
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "matrix=$json" >> $GITHUB_OUTPUT
          fi

  validate:
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull PBIP diff Docker image
        id: pull
        run: docker pull ghcr.io/${{ github.repository_owner }}/pbip-diff:latest
        continue-on-error: true

      - name: Install Python deps (fallback if Docker unavailable)
        if: steps.pull.outcome == 'failure'
        run: |
          pip install -r pbix_diff/requirements.txt
          echo "USE_DOCKER=false" >> $GITHUB_ENV

      - name: Set docker flag
        if: steps.pull.outcome == 'success'
        run: echo "USE_DOCKER=true" >> $GITHUB_ENV

      - name: Extract old version from base branch
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

          PROJECT_DIR="${{ matrix.project }}"
          mkdir -p /tmp/pbip_old

          if git --work-tree=/tmp/pbip_old \
                 checkout origin/${{ github.base_ref }} -- "$PROJECT_DIR" 2>/dev/null; then

            # Verify there is actually a .pbip file in the checked-out folder
            old_pbip=$(find /tmp/pbip_old/$PROJECT_DIR -maxdepth 1 -name "*.pbip" 2>/dev/null | head -1)
            if [ -n "$old_pbip" ]; then
              echo "IS_NEW_PROJECT=false" >> $GITHUB_ENV
              echo "Old project found: $old_pbip"
            else
              echo "IS_NEW_PROJECT=true" >> $GITHUB_ENV
              echo "Folder exists in base branch but no .pbip marker — treating as new project."
            fi
          else
            echo "IS_NEW_PROJECT=true" >> $GITHUB_ENV
            echo "Project folder not found in base branch — this is a new project."
          fi

      - name: Run PBIP diff
        shell: bash
        run: |
          PROJECT_DIR="${{ matrix.project }}"
          mkdir -p results

          if [ "${IS_NEW_PROJECT}" = "true" ]; then
            echo "New project — no previous version to diff against." > results/diff-output.txt
            exit 0
          fi

          OLD_DIR="/tmp/pbip_old/$PROJECT_DIR"
          NEW_DIR="./$PROJECT_DIR"

          # Confirm both sides have a .pbip marker before running
          old_pbip=$(find "$OLD_DIR" -maxdepth 1 -name "*.pbip" 2>/dev/null | head -1)
          new_pbip=$(find "$NEW_DIR" -maxdepth 1 -name "*.pbip" 2>/dev/null | head -1)

          if [ -z "$old_pbip" ]; then
            echo "No .pbip found in base branch at $OLD_DIR" > results/diff-output.txt
            exit 0
          fi
          if [ -z "$new_pbip" ]; then
            echo "No .pbip found in PR branch at $NEW_DIR" > results/diff-output.txt
            exit 0
          fi

          echo "Comparing same project:"
          echo "  OLD .pbip: $old_pbip"
          echo "  NEW .pbip: $new_pbip"

          if [ "$USE_DOCKER" = "true" ]; then
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -v "/tmp/pbip_old:/tmp/pbip_old" \
              ghcr.io/${{ github.repository_owner }}/pbip-diff:latest \
              --old "$OLD_DIR" \
              --new "/workspace/$PROJECT_DIR" \
              2>&1 | tee results/diff-output.txt
          else
            python pbix_diff/run.py \
              --old "$OLD_DIR" \
              --new "$NEW_DIR" \
              2>&1 | tee results/diff-output.txt
          fi

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          mkdir -p results

          # Dynamically find a SemanticModel with a complete definition/ folder
          # to use as the test fixture — no hardcoded paths
          TEST_SM=$(find . -type d -name "*.SemanticModel" \
                      -not -path '*/.git/*' \
                      -not -path '*/tmp/*' \
                    | while read -r sm; do
                        [ -d "$sm/definition" ] && echo "$sm" && break
                      done)

          echo "Using SemanticModel for tests: $TEST_SM"

          if [ "$USE_DOCKER" = "true" ]; then
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              -e "TEST_SEMANTIC_MODEL=$TEST_SM" \
              --entrypoint python \
              ghcr.io/${{ github.repository_owner }}/pbip-diff:latest \
              -m unittest discover -s pbix_diff -p 'test_*.py' \
              2>&1 | tee results/test-output.txt
          else
            TEST_SEMANTIC_MODEL="$TEST_SM" \
            python -m unittest discover -s pbix_diff -p 'test_*.py' \
              2>&1 | tee results/test-output.txt
          fi
          echo "status=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate PR comment
        shell: bash
        run: |
          python3 - <<PYEOF
          import os, textwrap

          project = os.environ.get("PROJECT", "").strip() or "powerBi"
          status  = os.environ.get("STATUS", "1")

          with open("results/test-output.txt") as f:
              test_output = f.read()
          try:
              with open("results/diff-output.txt") as f:
                  diff_output = f.read()
          except FileNotFoundError:
              diff_output = "Diff was not run."

          result = "✅ All tests passed" if status == "0" else "❌ Some tests failed"

          body = f"""### PBIP Validation — `{project}`

          **Status:** {result}

          <details>
          <summary>📊 PBIP diff report</summary>

          \`\`\`
          {diff_output}
          \`\`\`

          </details>

          <details>
          <summary>🧪 Unit test output</summary>

          \`\`\`
          {test_output}
          \`\`\`

          </details>
          """

          os.makedirs("results", exist_ok=True)
          with open("results/comment.txt", "w") as f:
              f.write(textwrap.dedent(body))
          PYEOF
        env:
          PROJECT: ${{ matrix.project }}
          STATUS: ${{ steps.tests.outputs.status }}

      - name: Find existing PR comment for this project
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "PBIP Validation — `${{ matrix.project }}`"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-file: results/comment.txt
          edit-mode: replace

      - name: Fail job if tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1