name: Build and Push PBIP Diff Image

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pbix_diff/**'
      - 'Dockerfile'
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main
    paths:
      - 'pbix_diff/**'
      - 'Dockerfile'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a PR → push a temp image tagged with the PR number.
      # On a merge (push to main/main-v2) → push the real latest + branch tag.
      - name: Build and push (PR — temp image)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pbip-diff:temp
            ghcr.io/${{ github.repository_owner }}/pbip-diff:pr-${{ github.event.pull_request.number }}

      - name: Build and push (merge — production image)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pbip-diff:latest
            ghcr.io/${{ github.repository_owner }}/pbip-diff:${{ github.ref_name }}